  <style>
    :root {
      --bg: #353535;
      --fg: #d8d8d8;
      --dim: #8c8c8c;
      --link: #e9e9e9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", Courier, "Liberation Mono", monospace;
      font-size: 17px;
      line-height: 1.7;
      text-transform: lowercase;
      text-align: center;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 34rem;
      padding: 2rem 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: -0.02em;
    }
    .bio { margin: 0.25rem 0 0; color: var(--dim); }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      margin-left: 0.15em;
      background: var(--fg);
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    hr {
      border: 0;
      border-top: 1px dashed var(--dim);
      margin: 2.5rem 0;
      opacity: 0.5;
    }
    .links { margin: 0; }
    .links .sep { color: var(--dim); margin: 0 0.5em; }
    a { color: var(--link); text-decoration: none; }
    a:hover { background: var(--fg); color: var(--bg); text-decoration: none; }
    a:focus-visible { outline: 1px dashed var(--fg); outline-offset: 3px; }
    .dd { position: relative; display: inline-block; }
    .dd-btn {
      font: inherit;
      color: var(--link);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-transform: lowercase;
    }
    .dd-btn:hover, .dd-btn[aria-expanded="true"] { background: var(--fg); color: var(--bg); }
    .dd-btn:focus-visible { outline: 1px dashed var(--fg); outline-offset: 3px; }
    .dd-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      padding: 0.35rem 0.9rem;
      background: var(--bg);
      border: 1px dashed var(--dim);
      z-index: 10;
    }
    .dd-menu.open { display: block; }
    .dd-menu a { display: block; white-space: nowrap; }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom, 0px));
      font-size: 0.8rem;
      color: var(--dim);
      text-align: center;
    }
    @media (max-width: 420px) {
      body { font-size: 15px; }
    }
  </style>

    </p>

  </main>

  <footer><a href="https://github.com/adi3www" target="_blank" rel="noopener">[ github ]</a></footer>

  <script>
    (function () {
      var btn = document.querySelector('.dd-btn');
      var menu = document.getElementById('trojan-menu');
      if (!btn || !menu) return;
      function setOpen(open) {
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(!menu.classList.contains('open'));
      });
      document.addEventListener('click', function (e) {
        if (!menu.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>
</body>
